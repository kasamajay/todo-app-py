name: todo-app-py

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - ./api/data:/app/data
    working_dir: /app
    environment:
      - ADDR=:8080
      - DATA_DIR=/app/data
      # Docker Desktop's Windows bind mount doesn't propagate file-change
      # events, so uvicorn --reload (watchfiles) falls back to polling.
      - WATCHFILES_FORCE_POLLING=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:5173/api/auth/google/callback}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir app --no-access-log

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - VITE_API_PROXY_TARGET=http://api:8080
    depends_on:
      - api
    command: node node_modules/vite/bin/vite.js --host 0.0.0.0 --clearScreen false
