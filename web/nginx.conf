# Production-mode nginx: serves the Vite bundle from /usr/share/nginx/html and
# reverse-proxies /api/* to the api container (the job Vite's dev-server proxy
# does in dev mode). See decisions/0013-production-mode-nginx-static-bundle.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Attachments are capped at 10MB by the api (maxAttachmentBytes); allow a
    # little extra for multipart overhead. nginx's default is only 1m.
    client_max_body_size 11m;

    location /api/ {
        # Docker service-name DNS, same target as VITE_API_PROXY_TARGET in dev.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames under /assets/, so they can be
    # cached forever - a new build produces new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # main.jsx picks the admin app from window.location.pathname (/admin), so
    # any non-file path must fall back to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the hashed bundles, so it must always be
    # revalidated or browsers keep loading a stale build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
